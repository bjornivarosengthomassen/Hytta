<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hytta">
<meta name="theme-color" content="#e7e3dd">
<style>html,body{margin:0;padding:0}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}</style>
<title>Hytta fra bunnen</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F2F1EF; --paper-2:#E6E2DF; --surface:#FFFFFF; --surface-2:#EDEAE6; --surface-3:#F8F7F5;
  --ink:#16161A; --ink-2:#55555C; --ink-3:#84848B;
  --line:#DEDAD6; --line-strong:#C6C1BB;
  --accent:#4A1226; --accent-soft:#FBE7EB; --accent-ink:#4A1226; --on-accent:#F7DDE2;
  --sage:#A8C3AF; --navy:#37485A;
  --warn:#7A5716; --warn-soft:#F3E8D3;
  --crit:#8D2F24; --crit-soft:#F6E0DB;
  --h1bg:#4A1226; --h1fg:#F7DDE2; --h1sub:#E7BFC8;
  --h2bg:#A8C3AF; --h2fg:#15231A; --h2sub:#3B5643;
  --h3bg:#FBE7EB; --h3fg:#4A1226; --h3sub:#7A3348;
  --h4bg:#37485A; --h4fg:#F1F3F5; --h4sub:#BFCBD8;
  --focus:#1558B0;
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --disp:"Newsreader",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16161A; --paper-2:#1D1D22; --surface:#212127; --surface-2:#2B2B32; --surface-3:#1B1B20;
    --ink:#F2F0EE; --ink-2:#A9A7AE; --ink-3:#82808A;
    --line:#33333A; --line-strong:#4A4A53;
    --accent:#EFC9D2; --accent-soft:#3B1A24; --accent-ink:#F3D7DD; --on-accent:#2A0A15;
    --sage:#6E8E77; --navy:#8FA6BC;
    --warn:#DCB271; --warn-soft:#3A2F17;
    --crit:#EF9081; --crit-soft:#3C2019;
    --h1bg:#3B1A24; --h1fg:#F5DCE1; --h1sub:#D3A9B3;
  --h2bg:#31453A; --h2fg:#DCE8DF; --h2sub:#A9C0B0;
  --h3bg:#2E2128; --h3fg:#EFC9D2; --h3sub:#BE97A2;
  --h4bg:#243039; --h4fg:#DDE6EE; --h4sub:#A6B6C5;
  --focus:#8FC2FF;
  }
}
:root[data-theme="dark"]{
    --paper:#16161A; --paper-2:#1D1D22; --surface:#212127; --surface-2:#2B2B32; --surface-3:#1B1B20;
  --ink:#F2F0EE; --ink-2:#A9A7AE; --ink-3:#82808A;
  --line:#33333A; --line-strong:#4A4A53;
  --accent:#EFC9D2; --accent-soft:#3B1A24; --accent-ink:#F3D7DD; --on-accent:#2A0A15;
  --sage:#6E8E77; --navy:#8FA6BC;
  --warn:#DCB271; --warn-soft:#3A2F17;
  --crit:#EF9081; --crit-soft:#3C2019;
  --h1bg:#3B1A24; --h1fg:#F5DCE1; --h1sub:#D3A9B3;
  --h2bg:#31453A; --h2fg:#DCE8DF; --h2sub:#A9C0B0;
  --h3bg:#2E2128; --h3fg:#EFC9D2; --h3sub:#BE97A2;
  --h4bg:#243039; --h4fg:#DDE6EE; --h4sub:#A6B6C5;
  --focus:#8FC2FF;
}
body[data-mode="dark"]{
  --paper:#16161A; --paper-2:#1D1D22; --surface:#212127; --surface-2:#2B2B32; --surface-3:#1B1B20;
  --ink:#F2F0EE; --ink-2:#A9A7AE; --ink-3:#82808A;
  --line:#33333A; --line-strong:#4A4A53;
  --accent:#EFC9D2; --accent-soft:#3B1A24; --accent-ink:#F3D7DD; --on-accent:#2A0A15;
  --sage:#6E8E77; --navy:#8FA6BC;
  --warn:#DCB271; --warn-soft:#3A2F17;
  --crit:#EF9081; --crit-soft:#3C2019;
  --h1bg:#3B1A24; --h1fg:#F5DCE1; --h1sub:#D3A9B3;
  --h2bg:#31453A; --h2fg:#DCE8DF; --h2sub:#A9C0B0;
  --h3bg:#2E2128; --h3fg:#EFC9D2; --h3sub:#BE97A2;
  --h4bg:#243039; --h4fg:#DDE6EE; --h4sub:#A6B6C5;
  --focus:#8FC2FF;
}
body[data-mode="light"]{
  --paper:#F2F1EF; --paper-2:#E6E2DF; --surface:#FFFFFF; --surface-2:#EDEAE6; --surface-3:#F8F7F5;
  --ink:#16161A; --ink-2:#55555C; --ink-3:#84848B;
  --line:#DEDAD6; --line-strong:#C6C1BB;
  --accent:#4A1226; --accent-soft:#FBE7EB; --accent-ink:#4A1226; --on-accent:#F7DDE2;
  --sage:#A8C3AF; --navy:#37485A;
  --warn:#7A5716; --warn-soft:#F3E8D3;
  --crit:#8D2F24; --crit-soft:#F6E0DB;
  --h1bg:#4A1226; --h1fg:#F7DDE2; --h1sub:#E7BFC8;
  --h2bg:#A8C3AF; --h2fg:#15231A; --h2sub:#3B5643;
  --h3bg:#FBE7EB; --h3fg:#4A1226; --h3sub:#7A3348;
  --h4bg:#37485A; --h4fg:#F1F3F5; --h4sub:#BFCBD8;
  --focus:#1558B0;
}
*{box-sizing:border-box}
html{scroll-padding-top:120px;scroll-padding-bottom:190px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
ul{list-style:none;margin:0;padding:0}
h1,h2{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:660px;margin:0 auto;padding-inline:20px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{font-family:var(--disp);font-weight:700;font-size:1.125rem;letter-spacing:-.03em;padding:8px 10px 8px 0;margin-left:-2px;border-radius:10px;color:var(--ink)}
.brand:disabled{cursor:default}
.brand span{color:var(--accent)}
/* Alt utenfor hovedflyten står på en egen, litt mørkere flate */
body.side{background:var(--paper-2)}
body.side .top{background:var(--paper-2)}
body.side .bar{background:linear-gradient(to top,var(--paper-2) 58%,color-mix(in srgb,var(--paper-2) 0%,transparent))}
body.side .legend,body.side .nick,body.side .sugg button{background:var(--surface)}
.topbtns{display:flex;align-items:center;gap:2px;margin-right:-10px}
.iconbtn{position:relative;width:46px;height:46px;border-radius:999px;display:grid;place-items:center}
.iconbtn .badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.625rem;font-weight:700;display:grid;place-items:center;line-height:1}
.iconbtn svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.9}

.cycle{display:flex;align-items:center;gap:8px;padding-block:16px 4px}
.cycle ol{display:flex;align-items:center;gap:8px;margin:0;padding:0;list-style:none;flex-wrap:wrap}
.cycle li{font-size:.6875rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.cycle li::after{content:"";width:12px;height:1px;background:var(--line-strong)}
.cycle li:last-child::after{display:none}
.cycle li.on{color:var(--ink)}
.cycle li.on::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--accent);margin-right:-2px}
.cycle .loop{font-size:.8125rem;color:var(--ink-3);margin-left:-2px}
.where{font-size:.6875rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 6px}
.carry{border-left:3px solid var(--line-strong);padding-left:12px;opacity:.75}

main{padding-bottom:180px;min-height:70vh}
.screen{padding-top:16px}
.screen h1{font-size:clamp(2rem,8.5vw,2.5rem);line-height:1.04;margin-bottom:6px}
.sub{color:var(--ink-2);font-size:.875rem;margin:0 0 4px}
.lede{color:var(--ink-2);font-size:.9375rem;margin:0 0 28px;max-width:34em}
.note{font-size:.875rem;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:11px 14px;margin:0 0 20px}

.hero{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 20px;position:relative;text-align:left;margin-bottom:10px}
.hero-label{display:block;font-size:.6875rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.hero h1{font-size:clamp(1.75rem,7.5vw,2.25rem);line-height:1.04;margin:0 0 8px;padding-right:40px}
.hero-sub{display:block;font-size:.9375rem;color:var(--ink-2)}
.hero-go{position:absolute;right:18px;top:18px;width:36px;height:36px;border-radius:999px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:1.05rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;text-align:left}
.t-n{font-family:var(--disp);font-size:1.0625rem;font-weight:600;letter-spacing:-.01em}
.t-c{font-size:.8125rem;color:var(--ink-2)}
.quietrow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:62px;margin-top:10px;padding:0 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:1rem;font-weight:500}
.quietrow span{color:var(--ink-2);font-size:.875rem;font-weight:400}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);min-height:62px}
.row-main{flex:1;min-width:0;padding:12px 4px 12px 0;display:block;border-radius:8px}
.row-name{display:block;font-size:1.0625rem;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere}
.row-name mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 2px}
.row-meta{display:block;font-size:.8125rem;color:var(--ink-2);margin-top:1px;overflow-wrap:anywhere}
.thumb{flex:none;width:42px;height:42px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--surface-2)}
.star{flex:none;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;margin-left:-6px}
.star svg{width:20px;height:20px;stroke:var(--ink-3);fill:none;stroke-width:1.6}
.star[aria-pressed="true"] svg{fill:var(--warn);stroke:var(--warn)}
.tag{display:inline-block;margin-left:8px;font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
.tag.out{background:var(--crit-soft);color:var(--crit)}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--surface);font-size:1.2rem;line-height:1}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper .val{min-width:58px;text-align:center;padding:0 2px}
.stepper .val b{display:block;font-family:var(--disp);font-size:1.0625rem;font-weight:600;line-height:1.1}
.stepper .val i{font-style:normal;color:var(--ink-2);font-size:.6875rem}
.grouplbl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.6875rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.grouplbl .tot{letter-spacing:.02em;text-transform:none;font-weight:500;color:var(--ink-3)}
.rows + .grouplbl,.sugg + .grouplbl,form + .grouplbl{margin-top:30px}

.check{display:flex;align-items:center;gap:14px;min-height:62px;padding:9px 0;border-radius:8px;flex:1;min-width:0}
.box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line-strong);display:grid;place-items:center;background:var(--surface)}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:16px;height:16px;stroke:var(--on-accent);stroke-width:2.6;fill:none;opacity:0}
.check[aria-pressed="true"] .box svg{opacity:1}
.check-txt{flex:1;min-width:0;font-size:1.0625rem;overflow-wrap:anywhere}
.check[aria-pressed="true"] .check-txt{text-decoration:line-through;color:var(--ink-3)}
.check-qty{font-size:.8125rem;color:var(--ink-2);flex:none}
.rowmore{flex:none;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);font-size:1rem;letter-spacing:.06em}
.nick{width:100%;margin-top:6px;min-height:42px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-3);padding:8px 12px;font-size:.9375rem}
.btn:disabled{opacity:.45;cursor:default}
.legend{font-size:.8125rem;color:var(--ink-2);background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin:0 0 14px}
.stwarn{margin:0 0 20px;padding:14px 16px;border-radius:18px;background:var(--surface-3);
  border:1px solid var(--line-strong);font-size:.9375rem;line-height:1.45}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg+.legend,.sugg+.rows{margin-top:26px}
.sugg button{min-height:44px;padding:0 15px;border-radius:999px;border:1px dashed var(--line-strong);background:var(--surface-3);font-size:.9375rem}
.check .row-meta{margin-top:1px}
.check > span:not(.box){flex:1;min-width:0}
.addline{display:flex;gap:8px;margin-bottom:24px}
.addline input{flex:1;height:52px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);padding:0 18px}
.addline button{flex:none;height:52px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600}

.focus{padding-top:26px}
.focus .count{font-size:.6875rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:20px}
.focus h1{font-size:clamp(2.3rem,12vw,3.2rem);line-height:.98;margin-bottom:10px}
.focus .amount{font-family:var(--disp);font-size:1.3rem;font-weight:500;color:var(--ink-2)}
.focus .hint{font-size:.875rem;color:var(--ink-2);margin:28px 0 10px}
.roomlist{display:flex;flex-wrap:wrap;gap:8px}
.roomlist button{min-height:50px;padding:0 18px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:1rem}
.roomlist button.sug{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.roomlist button.other{border-style:dashed;color:var(--ink-2)}

.wood{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.photo{display:block;width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:16px}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.meter button{height:58px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0}
.meter button[data-on="1"]{background:var(--accent);border-color:var(--accent)}
.meter button[data-on="1"][data-tone="warn"]{background:var(--warn);border-color:var(--warn)}
.meter button[data-on="1"][data-tone="crit"]{background:var(--crit);border-color:var(--crit)}
.meter-legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.meter-legend span{font-size:.5938rem;color:var(--ink-2);text-align:center;line-height:1.25}
.woodstate{font-family:var(--disp);font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin-bottom:16px}
.woodbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.mini{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:.875rem;font-weight:500}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:44;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
     background:linear-gradient(to top,var(--paper) 58%,color-mix(in srgb,var(--paper) 0%,transparent))}
.bar .inner{max-width:660px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.barrow{display:flex;gap:8px;width:100%}
.btn{width:100%;min-height:56px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);
     font-weight:600;font-size:1.0625rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);padding:0 18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.quiet{font-size:.8125rem;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center}

.searchfield{position:relative;display:flex;align-items:center;margin-bottom:18px}
.searchfield svg{position:absolute;left:15px;width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:1.8;pointer-events:none}
.searchfield input{width:100%;height:52px;padding:0 16px 0 44px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface)}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;margin-bottom:20px}
.tabs button{flex:1;min-height:40px;border-radius:999px;font-size:.875rem;font-weight:600;color:var(--ink-2);text-align:center}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:7px;min-height:44px;font-size:.875rem;color:var(--ink-2);font-weight:500}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.navlist{border-top:1px solid var(--line)}
.navlist li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.navlist .go{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:10px 2px}
.navlist .n{font-size:1.0625rem;font-weight:500}
.navlist .ok{color:var(--accent);font-weight:700;margin-right:8px}
.navlist .t{font-size:.75rem;color:var(--ink-3);display:block;margin-top:1px}
.navlist .c{font-size:.8125rem;color:var(--ink-2);flex:none}
.gtot{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:600;font-size:1.0625rem;padding-right:4px}
.chev{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2.2;transition:transform .15s}
.chev.up{transform:rotate(180deg)}
.empty{color:var(--ink-3);font-size:.9375rem;padding:18px 0;border-top:1px solid var(--line)}
.synline{font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px;margin:40px 0 0}

.backdrop{position:fixed;inset:0;background:rgba(14,20,14,.44);z-index:60;opacity:0;transition:opacity .18s}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-height:88vh;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .22s cubic-bezier(.3,.8,.4,1)}
.sheet.on{transform:translateY(0)}
@media(min-width:620px){
  .sheet{left:50%;transform:translate(-50%,100%);width:520px;border-radius:20px;bottom:24px;border:1px solid var(--line)}
  .sheet.on{transform:translate(-50%,0)}
}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line-strong);margin:6px auto 16px}
.sheet h2{font-size:1.3rem;margin-bottom:18px}

<script>

})();

var Cache={
  read:function(){try{var r=localStorage.getItem(CACHE_KEY);return r?JSON.parse(r):null}catch(e){return null}},
  write:function(s){try{localStorage.setItem(CACHE_KEY,JSON.stringify(s));}catch(e){if(!Cache._w){Cache._w=1;toast("Lite lagringsplass lokalt");}}}
};
function noop(){}
function clean(o){var c={};for(var k in o){if(k!=="id"&&o[k]!==undefined)c[k]=o[k];}return c;}

  save:function(coll,obj){if(MEID)obj.by=MEID;Cache.write(S);if(db)db.collection(coll).doc(obj.id).set(clean(obj)).catch(noop);},
  remove:function(coll,id){Cache.write(S);if(db)db.collection(coll).doc(id).delete().catch(noop);},
  saveMeta:function(){if(MEID)S.settings.by=MEID;Cache.write(S);if(db)db.doc("meta/settings").set(clean(S.settings)).catch(noop);}
};

/* ============================== Modell ============================== */

var ROOMCATS={

function byId(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}

function pName(p){return p?(p.nick||p.type):"Uten rom";}

function itemsIn(id){return S.items.filter(function(i){return i.placeId===id;});}
function isLow(it){return it.min>0&&Number(it.qty)<=Number(it.min);}

function catsFor(p){
  var pref=(p&&ROOMCATS[p.type])||[];
  return pref.concat(CATS.filter(function(c){return pref.indexOf(c)<0;}));
}
function when(ts){
  if(!ts)return "";
  var d=new Date(ts),n=new Date();
  var days=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(days<=0)return "i dag";
  if(days===1)return "i går";
  if(days<7)return "for "+days+" dager siden";
  var m=["jan.","feb.","mars","apr.","mai","juni","juli","aug.","sep.","okt.","nov.","des."];
  return d.getDate()+". "+m[d.getMonth()];
}
function totals(its){
  var m={},o=[];
  its.forEach(function(i){var u=i.unit||"stk";if(m[u]===undefined){m[u]=0;o.push(u);}m[u]+=Number(i.qty)||0;});

  if(!o)return "";

function pickPhoto(cb,camera){
  var inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";inp.style.cssText="position:fixed;left:-9999px";
  if(camera)inp.setAttribute("capture","environment");
  document.body.appendChild(inp);
  inp.onchange=function(){var f=inp.files&&inp.files[0];document.body.removeChild(inp);if(f)processPhoto(f,cb);};
  inp.click();
}
function processPhoto(file,cb){
  toast("Behandler bildet …");
  var u=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var max=assets?1280:760,sc=Math.min(1,max/Math.max(img.width,img.height));
    var c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);
    if(assets&&c.toBlob){
      c.toBlob(function(b){
        if(!b)return toast("Fikk ikke lest bildet");
        assets.upload(b).then(function(r){cb({photoId:r.id,photo:null,blob:b});})
                        .catch(function(){cb({photoId:null,photo:c.toDataURL("image/jpeg",.7),blob:b});});
      },"image/jpeg",.82);
    }else{
      var du="";try{du=c.toDataURL("image/jpeg",.7);}catch(e){return toast("Fikk ikke lagret bildet");}
      if(c.toBlob)c.toBlob(function(b){cb({photoId:null,photo:du,blob:b});},"image/jpeg",.85);
      else cb({photoId:null,photo:du,blob:null});
    }
  };
  img.onerror=function(){URL.revokeObjectURL(u);toast("Fikk ikke lest bildet");};
  img.src=u;
}
function dropPhoto(id){if(id&&assets)assets.delete(id).catch(noop);}

var STARTROOMS=["Kjøkken","Soverom","Bad","Gang"];
function seed(){
  /* Helt tomt – brukeren setter opp hytta selv */
  S.places=[];S.items=[];S.list=[];
  S.settings=normSettings({onboarded:false,setup:"velkommen",setupIdx:0});

/* ============================== Oppstart ============================== */
function themeGet(){try{return localStorage.getItem("hytta.theme")||"auto";}catch(e){return "auto";}}
function themeSet(v){try{localStorage.setItem("hytta.theme",v);}catch(e){}applyTheme();}
function applyTheme(){
  var t=themeGet();
  if(t==="auto")document.body.removeAttribute("data-mode");
  else document.body.setAttribute("data-mode",t);
}
function themeIsDark(){
  var t=themeGet();
  if(t!=="auto")return t==="dark";
  return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function boot(){
  applyTheme();
  var c=Cache.read();
  if(c&&c.places&&c.places.length&&c.settings&&c.settings.schema===SCHEMA){S=c;S.settings=normSettings(S.settings);}
  else{seed();Cache.write(S);}
  sortPlaces();
  if(S.settings.onboarded)screen="home";   /* startsiden er utgangspunktet */
  /* Har vi ingenting lokalt, men kan snakke med skyen: vent litt med å
     tilby oppsett, så vi ikke ber deg sette opp en hytte du alt har. */
  LOADING=!!(window.claude&&window.claude.use)&&!S.places.length;
  if(LOADING)setTimeout(function(){if(LOADING){LOADING=false;render();}},9000);
  bindStatic();render();connect();
}
function initUser(){
  if(!(window.claude&&window.claude.use)){userTried=true;return;}
  try{
    Promise.resolve(window.claude.use("user")).then(function(u){
      userTried=true;
      if(!u)return render();
      USERCAP=u;
      return Promise.all([u.id(),u.me(),u.isOwner(),u.canEdit()]).then(function(r){
        MEID=r[0]||null;
        if(r[1]&&MEID)PROFILES[MEID]={name:r[1].name||""};
        MEROLE=r[2]?"Eier":(r[3]?"Kan endre":"Kan se");
        render();
      });
    }).catch(noop);
  }catch(e){}
}
function nameOf(id){
  if(!id)return "";
  var p=PROFILES[id];
  var n=p&&p.name||"";
  if(n)return n;
  return id===MEID?"deg":"en annen";
}
function ensureNames(ids){
  if(!USERCAP||!USERCAP.profiles)return;
  var need=[];
  ids.forEach(function(i){if(i&&!PROFILES[i]&&!PENDING[i]&&need.indexOf(i)<0)need.push(i);});
  if(!need.length)return;
  need.forEach(function(i){PENDING[i]=1;});
  Promise.resolve(USERCAP.profiles(need)).then(function(ps){
    need.forEach(function(i){PROFILES[i]=(ps&&ps[i])?ps[i]:{name:""};});
    render();
  }).catch(function(){need.forEach(function(i){PROFILES[i]={name:""};});});
}
function doneLoading(){if(!LOADING)return;LOADING=false;render();}
function connect(){
  if(!(window.claude&&window.claude.use))return doneLoading();
  initUser();initSample();
  try{Promise.resolve(window.claude.use("assets")).then(function(a){assets=a||null;}).catch(noop);}catch(e){}
  var p;try{p=window.claude.use("db");}catch(e){return doneLoading();}
  Promise.resolve(p).then(function(cap){
    if(!cap)return doneLoading();
    db=cap;
    return Promise.all([db.collection("places").get(),db.collection("items").get(),
                        db.collection("list").get(),db.doc("meta/settings").get()])
    .then(function(r){
      var stored=r[3].exists?r[3].data():null;
      var remoteEmpty=r[0].empty&&r[1].empty;
      var stale=!!(stored&&stored.schema!==SCHEMA);
      if(!remoteEmpty&&!stale){
        /* Skyen har hytta – den vinner alltid over en tom telefon */
        S.places=r[0].docs.map(toObj);S.items=r[1].docs.map(toObj);S.list=r[2].docs.map(toObj);
        S.settings=normSettings(stored||S.settings);
        if(S.places.length)S.settings.onboarded=true;   /* har du rom, er du ferdig med oppsettet */
        sortPlaces();Cache.write(S);
        if(screen==="step"&&S.settings.onboarded)screen="home";
        render();
        return;
      }
      /* Skyen er tom eller utdatert. Vi legger BARE opp noe hvis vi
         faktisk har noe å legge opp – ellers ville en tom start slettet
         hytta for alle. */
      if(S.places.length)return wipeAndPush(r);
    }).then(function(){syncState="synkronisert";LOADING=false;subscribe();render();});
  }).catch(function(){db=null;doneLoading();});
}
function toObj(d){var o=d.data()||{};o.id=d.id;return o;}
function wipeAndPush(r){
  /* Ny datamodell: fjern gamle dokumenter og legg opp de nye */
  var del=[];
  ["places","items","list"].forEach(function(n,i){
    r[i].docs.forEach(function(d){del.push(db.collection(n).doc(d.id));});
  });
  function drop(){
    if(!del.length)return push();
    return Promise.all(del.splice(0,8).map(function(d){return d.delete();})).then(drop);
  }
  function push(){
    var jobs=[];
    S.places.forEach(function(p){jobs.push(["places",p]);});
    S.items.forEach(function(i){jobs.push(["items",i]);});
    S.list.forEach(function(l){jobs.push(["list",l]);});
    function next(){
      if(!jobs.length)return db.doc("meta/settings").set(clean(S.settings));
      return Promise.all(jobs.splice(0,6).map(function(j){return db.collection(j[0]).doc(j[1].id).set(clean(j[1]));})).then(next);
    }
    return next();
  }
  return drop();
}
function subscribe(){
  ["places","items","list"].forEach(function(n){
    db.collection(n).onSnapshot(function(s){
      S[n]=s.docs.map(toObj);if(n==="places")sortPlaces();
      Cache.write(S);render();
    },noop);
  });
  db.doc("meta/settings").onSnapshot(function(s){
    if(s.exists){S.settings=normSettings(s.data());Cache.write(S);render();}
  },noop);
}

function roomRows(p){
  var its=itemsIn(p.id);
  if(!its.length)return '<p class="empty">Ingenting registrert her ennå.</p>';
  var favs=its.filter(function(i){return i.fav;}).sort(byName);
  var rest=its.filter(function(i){return !i.fav;});
  var h="";
  if(favs.length){
    h+=groupLabel("Favoritter")+'<ul class="rows">';
    favs.forEach(function(it){h+=itemRow(it,"");});
    h+='</ul>';
  }
  var g={};
  rest.forEach(function(it){var c=it.cat||"Annet";(g[c]=g[c]||[]).push(it);});
  catsFor(p).forEach(function(c){
    if(!g[c])return;
    g[c].sort(byName);
    h+=groupLabel(c)+'<ul class="rows">';
    g[c].forEach(function(it){h+=itemRow(it,"");});
    h+='</ul>';

/* ===================== Bildegjenkjenning =====================
   Ta bilde av et skap, en strekkode eller en enkelt vare – Claude
   foreslår hva det er, og du retter før det legges inn. */
var SAMPLE=null, SAMPLE_IMG=false, SAMPLE_TYPES="image/*";
function initSample(){
  if(!(window.claude&&window.claude.use))return;
  try{
    Promise.resolve(window.claude.use("sample")).then(function(sm){
      if(!sm)return;
      SAMPLE=sm;
      return Promise.resolve(sm.limits()).then(function(l){
        if(l&&l.images){
          SAMPLE_IMG=true;
          if(l.images.mediaTypes&&l.images.mediaTypes.length)SAMPLE_TYPES=l.images.mediaTypes.join(",");
        }
        render();
      });
    }).catch(noop);
  }catch(e){}
}
/* Hvorfor et bilde ikke kan tolkes akkurat nå – tomt når det kan */
function aiWhy(){
  if(!(window.claude&&window.claude.use))
    return "Forslag fra bilde virker bare når appen åpnes i Claude. Fyll ut selv.";
  if(!SAMPLE)
    return "Forslag fra bilde er ikke tilgjengelig her. Fyll ut selv.";
  return "";
}
function pickFile(cb){
  var inp=document.createElement("input");
  inp.type="file";inp.accept=SAMPLE_TYPES;inp.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(inp);
  inp.onchange=function(){var f=inp.files&&inp.files[0];document.body.removeChild(inp);if(f)cb(f);};
  inp.click();
}
function shrink(file,max,cb){
  var u=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var sc=Math.min(1,max/Math.max(img.width,img.height));
    if(sc===1){URL.revokeObjectURL(u);return cb(file,u);}
    var c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(b){cb(b||file,c.toDataURL("image/jpeg",.7));URL.revokeObjectURL(u);},"image/jpeg",.85);
  };
  img.onerror=function(){URL.revokeObjectURL(u);cb(file,"");};
  img.src=u;
}
function scanError(code){
  if(code==="not_granted")return "Du må gi appen lov til å bruke Claude for å lese bilder.";
  if(code==="rate_limited")return "For mange forespørsler akkurat nå. Prøv igjen om litt.";
  if(code==="image_rejected")return "Bildet ble ikke godtatt. Prøv et annet.";
  if(code==="invalid_json")return "Fikk ikke tydelig svar. Prøv et nytt bilde.";
  if(code==="cancelled")return "";
  return "Klarte ikke å lese bildet. Prøv igjen.";
}
function photoScan(pid){
  if(!SAMPLE||!SAMPLE_IMG)return toast("Bildegjenkjenning er ikke tilgjengelig her");
  pickFile(function(file){ shrink(file,1600,function(blob,prev){ scanSheet(pid,blob,prev); }); });
}
function scanSheet(pid,blob,prev){

    '<div class="sheetbtns"><button type="button" class="btn dark" id="sc-add" hidden>Legg til</button>'+
    '<button type="button" class="btn" id="sc-cancel">Avbryt</button></div>';
  openSheet(h,function(sh){
    sh.querySelector("#sc-cancel").onclick=function(){ctl.abort();closeSheet();};
    var prompt=
      'Dette er et bilde tatt på en hytte, i rommet "'+pName(p)+'".\n'+
      'Oppgave: list opp tingene på bildet som er verdt å ha i en varebeholdning for hytta.\n'+
      'Viser bildet en strekkode, en produktetikett eller én enkelt vare, identifiser produktet så presist du kan.\n'+
      'Bruk norske navn. Ikke ta med møbler, vegger, gulv, hyller eller ting som er en del av rommet.\n'+
      'Svar med KUN en JSON-array, maks 12 objekter, slik:\n'+
      '[{"navn":"Kaffe","kategori":"Mat","antall":2,"enhet":"poser"}]\n'+
      'kategori må være en av: '+CATS.join(", ")+'.\n'+
      'enhet må være en av: '+UNITS.join(", ")+'.\n'+
      'antall er hvor mange du ser, minst 1. Finner du ingenting, svar med [].';
    SAMPLE.json(prompt,{images:blob,modelTier:"default",signal:ctl.signal,cache:false})
      .then(function(list){
        if(!sheetEl)return;
        found=(Array.isArray(list)?list:[]).slice(0,12).map(function(r){
          var cat=CATS.indexOf(r&&r.kategori)>=0?r.kategori:(catsFor(p)[0]||"Annet");
          var unit=UNITS.indexOf(r&&r.enhet)>=0?r.enhet:"stk";
          return {name:String(r&&r.navn||"").trim(),cat:cat,unit:unit,
                  qty:Math.max(1,parseInt(r&&r.antall,10)||1),on:true};
        }).filter(function(r){return r.name;});
        drawScan(sh,found,pid);
      })
      .catch(function(e){
        if(!sheetEl)return;
        var m=scanError(e&&e.code);
        if(!m)return;
        sh.querySelector("#sc-st").innerHTML='<p class="note">'+esc(m)+'</p>';
      });
  });
}
function drawScan(sh,found,pid){
  var st=sh.querySelector("#sc-st"),box=sh.querySelector("#sc-rows"),add=sh.querySelector("#sc-add");
  if(!found.length){
    st.innerHTML='<p class="note">Fant ingenting å registrere i bildet.</p>';
    return;
  }
  st.innerHTML='<p class="sub">Fant '+found.length+' ting. Rett opp det som er feil, og hak av det du vil ha med.</p>';
  function paint(){
    box.innerHTML='<ul class="rows">'+found.map(function(r,i){
      return '<li class="row">'+
        '<button type="button" class="star" data-sc="'+i+'" aria-pressed="'+r.on+'" aria-label="Ta med '+esc(r.name)+'">'+
          '<span class="box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></span></button>'+
        '<input class="nick" style="margin:0" type="text" data-sn="'+i+'" value="'+esc(r.name)+'" aria-label="Navn">'+
        '<input class="nick" style="margin:0;width:62px;text-align:center" type="number" min="1" data-sq="'+i+'" value="'+r.qty+'" aria-label="Antall">'+
      '</li>';
    }).join("")+'</ul>';
    box.querySelectorAll("[data-sc]").forEach(function(b){
      b.onclick=function(){found[+b.dataset.sc].on=!found[+b.dataset.sc].on;paint();count();};
    });
    box.querySelectorAll("[data-sn]").forEach(function(i){i.oninput=function(){found[+i.dataset.sn].name=i.value;};});
    box.querySelectorAll("[data-sq]").forEach(function(i){i.oninput=function(){found[+i.dataset.sq].qty=Math.max(1,parseInt(i.value,10)||1);};});
  }
  function count(){
    var n=found.filter(function(r){return r.on&&r.name.trim();}).length;
    add.textContent="Legg til "+n+" ting";add.hidden=false;add.disabled=!n;
  }
  paint();count();
  add.onclick=function(){
    var n=0;
    found.forEach(function(r){
      if(!r.on||!r.name.trim())return;
      var it={id:uid(),name:r.name.trim(),cat:r.cat,placeId:pid,qty:r.qty,unit:r.unit,min:0,note:"",
        fav:false,photoId:null,photo:null,updatedAt:Date.now()};
      S.items.push(it);Store.save("items",it);n++;
    });
    closeSheet();render();toast(n+" ting lagt i "+placeName(pid));
  };
}

function packedCount(){return S.list.filter(function(l){return l.packed;}).length;}
/* Vanlige hytteting å falle tilbake på når hytta di ikke gir nok forslag */
var COMMON=[["Melk","Mat"],["Brød","Mat"],["Kaffe","Drikke"],["Toalettpapir","Forbruksvarer"],
  ["Ved","Ved"],["Tennbriketter","Ved"],["Fyrstikker","Forbruksvarer"],["Smør","Mat"],
  ["Egg","Mat"],["Pålegg","Mat"],["Poteter","Mat"],["Pasta","Mat"],["Drikkevann","Drikke"],
  ["Oppvasksåpe","Forbruksvarer"],["Tørkerull","Forbruksvarer"],["Søppelsekker","Forbruksvarer"],
  ["Batterier","Utstyr"],["Kaffefilter","Forbruksvarer"],["Salt og pepper","Mat"],["Ull-undertøy","Klær"]];
/* Forslagene står hele tiden. Velger du ett, faller det ut og neste
   alternativ tar plassen – lavt først, så favoritter, så vanlige ting. */
function suggestions(){
  var have={};S.list.forEach(function(l){have[l.text.toLowerCase()]=1;});
  var out=[],seen={};
  function add(name,cat,unit){
    var k=String(name||"").trim();if(!k)return;
    var lk=k.toLowerCase();
    if(have[lk]||seen[lk]||out.length>=6)return;
    seen[lk]=1;out.push({name:k,cat:cat||"Annet",unit:unit||"stk"});
  }
  S.items.filter(isLow).sort(function(a,b){return (a.qty-a.min)-(b.qty-b.min);})
    .forEach(function(i){add(i.name,i.cat,i.unit);});
  S.items.filter(function(i){return i.fav;}).forEach(function(i){add(i.name,i.cat,i.unit);});
  COMMON.forEach(function(c){add(c[0],c[1],"stk");});
  S.items.slice().sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);})
    .forEach(function(i){add(i.name,i.cat,i.unit);});
  return out;
}

/* ============================ Handlinger ============================ */
function touch(it){it.updatedAt=Date.now();Store.save("items",it);}
function inRound(){return S.settings.roundOn;}
function bump(id,delta){
  var it=byId(S.items,id);if(!it)return;
  var wasLow=isLow(it);
  it.qty=Math.max(0,(Number(it.qty)||0)+delta);
  touch(it);
  var cell=document.querySelector('[data-q="'+id+'"]');
  if(cell)cell.innerHTML='<b>'+it.qty+'</b><i>'+esc(it.unit||"")+'</i>';
  var dec=document.querySelector('[data-a="dec"][data-id="'+id+'"]');
  if(dec)dec.disabled=it.qty<=0;
  if(inRound()&&!wasLow&&isLow(it))autoList(it);
  later();
}
function autoList(it){
  if(S.list.some(function(l){return l.itemId===it.id||l.text.toLowerCase()===it.name.toLowerCase();}))return;
  var need=Math.max(1,(Number(it.min)||1)-(Number(it.qty)||0));
  var e={id:uid(),text:it.name,qty:need+(it.unit?" "+it.unit:""),packed:false,carry:nextTripList(),itemId:it.id,order:Date.now()};
  S.list.push(e);Store.save("list",e);
  toast(it.name+" satt på lista","Angre",function(){delLine(e);render();});
}
function delLine(l){S.list=S.list.filter(function(x){return x.id!==l.id;});Store.remove("list",l.id);}
function delItem(it){
  S.items=S.items.filter(function(i){return i.id!==it.id;});
  Store.remove("items",it.id);
  S.list.filter(function(l){return l.itemId===it.id;}).forEach(delLine);
  render();
  toast(it.name+" er slettet","Angre",function(){S.items.push(it);Store.save("items",it);render();});
}
function goPhase(f){
  var st=S.settings;
  st.phase=f;
  if(f!=="kontroll")st.roundDone=[];
  if(f==="plan"){
    /* Ny tur: det som ble liggende igjen starter uavkrysset og uten merke */
    S.list.forEach(function(l){
      if(l.packed||l.carry){l.packed=false;l.carry=false;Store.save("list",l);}
    });
  }
  Store.saveMeta();screen="step";window.scrollTo(0,0);render();
}
function putIn(listId,placeId){
  var l=byId(S.list,listId);if(!l)return;
  var n=parseInt(l.num,10);
  if(!n||n<1)n=parseInt(String(l.qty||"").replace(/[^0-9]/g,""),10);
  if(!n||n<1)n=1;
  var it=matchItem(l),msg;
  if(it){
    it.qty=(Number(it.qty)||0)+n;it.placeId=placeId;touch(it);
    if(!it.photoId&&!it.photo&&(l.photoId||l.photo)){it.photoId=l.photoId||null;it.photo=l.photo||null;}
    msg=it.name+": "+it.qty+" "+(it.unit||"")+" i "+placeName(placeId);
  }else{
    var unit=l.unit||String(l.qty||"").replace(/[0-9\s]/g,"")||"stk";
    var p=place(placeId);
    it={id:uid(),name:l.text,cat:l.cat||(catsFor(p)[0]||"Annet"),placeId:placeId,qty:n,unit:unit,min:0,note:"",
        fav:false,photoId:l.photoId||null,photo:l.photo||null,updatedAt:Date.now()};
    S.items.push(it);Store.save("items",it);
    msg=it.name+" er registrert i "+placeName(placeId);
  }
  delLine(l);render();toast(msg);
}
/* Huker av i «Pakk ut»: kjenner appen tingen, går den rett i rommet sitt.
   Ellers spør vi om rom én gang. */
function placeLine(listId){
  var l=byId(S.list,listId);if(!l)return;
  var it=matchItem(l);
  if(it)return putIn(listId,it.placeId);

}

/* ============================== Bunnark ============================== */
var sheetEl=null,lastFocus=null,sheetGen=0;
function openSheet(html,setup){
  closeSheet(true);
  lastFocus=document.activeElement;
  var root=document.getElementById("sheetroot");
  root.innerHTML='<div class="backdrop" id="bd"></div><div class="sheet" role="dialog" aria-modal="true" id="sh"><div class="grab"></div>'+html+'</div>';
  sheetEl=document.getElementById("sh");
  requestAnimationFrame(function(){document.getElementById("bd").classList.add("on");sheetEl.classList.add("on");});
  document.getElementById("bd").onclick=function(){closeSheet();};
  document.body.style.overflow="hidden";
  if(setup)setup(sheetEl);
  var f=sheetEl.querySelector("input,textarea,button");if(f)f.focus();
  sheetEl.addEventListener("keydown",trap);
}
function trap(e){
  if(e.key==="Escape"){e.preventDefault();return closeSheet();}
  if(e.key!=="Tab")return;
  var f=sheetEl.querySelectorAll("button,input,textarea");
  if(!f.length)return;
  var a=f[0],b=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}
  else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}
}
function closeSheet(instant){
  var root=document.getElementById("sheetroot");
  if(!root.innerHTML)return;
  document.body.style.overflow="";
  sheetGen++;
  if(instant){root.innerHTML="";sheetEl=null;return;}
  var sh=document.getElementById("sh"),bd=document.getElementById("bd");
  if(sh)sh.classList.remove("on");if(bd)bd.classList.remove("on");
  var g=sheetGen;
  setTimeout(function(){if(g===sheetGen)root.innerHTML="";},200);
  sheetEl=null;
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function chips(name,opts,cur,lab){
  return '<div class="chips" data-chips="'+name+'">'+opts.map(function(o){
    var v=typeof o==="string"?o:o.id,l=lab?lab(o):o;
    return '<button type="button" data-val="'+esc(v)+'" aria-pressed="'+(v===cur)+'">'+esc(l)+'</button>';
  }).join("")+'</div>';
}

    '<div class="field"><span class="flabel">Antall</span><div class="qtyrow">'+
      '<div class="stepper"><button type="button" id="f-m" aria-label="Færre">−</button></div>'+
      '<input type="number" id="f-q" inputmode="numeric" min="0" step="1" value="'+(d.qty==null?1:d.qty)+'" aria-label="Antall">'+
      '<div class="stepper"><button type="button" id="f-p" aria-label="Flere">+</button></div></div></div>'+
    '<div class="field"><span class="flabel">Kategori</span>'+chips("cat",cats,d.cat)+'</div>'+

    '<button type="button" class="more" id="f-more" aria-expanded="false">Flere felt</button>'+
    '<div id="f-x" hidden>'+
      '<div class="field"><span class="flabel">Enhet</span>'+chips("unit",UNITS,d.unit)+'</div>'+
      '<div class="field"><label for="f-min">Minimumsnivå</label><input type="number" id="f-min" inputmode="numeric" min="0" step="1" value="'+(d.min||0)+'"></div>'+
      '<div class="field"><label for="f-note">Notat</label><textarea id="f-note">'+esc(d.note||"")+'</textarea></div></div>'+
    '<div class="sheetbtns"><button type="button" class="btn primary" id="f-s" style="flex:2">Lagre</button>'+
      (isNew?'<button type="button" class="btn" id="f-c" style="flex:1">Avbryt</button>'
            :'<button type="button" class="btn danger" id="f-d" style="flex:1">Slett</button>')+'</div>';
  if(!isNew)h+='<div class="actions">'+
      '<button type="button" id="a-f">'+(d.fav?"Fjern stjerne":"Sett stjerne")+'<span class="hint">øverst i rommet</span></button>'+
      '<button type="button" id="a-e">Merk som tomt<span class="hint">antall → 0</span></button>'+
      '<button type="button" id="a-l">Legg på lista</button></div>';

  openSheet(h,function(sh){

    var pick={unit:d.unit,placeId:d.placeId,cat:d.cat};
    sh.querySelectorAll("[data-chips]").forEach(function(g){
      g.addEventListener("click",function(e){
        var b=e.target.closest("button[data-val]");if(!b)return;
        g.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed","false");});

          ?"Denne viseren kan ikke sende bilder til Claude. Fyll ut selv."
          :scanError(c);

    function markChips(k,v){

    sh.querySelector("#f-s").onclick=function(){
      var name=sh.querySelector("#f-name").value.trim();
      if(!name){sh.querySelector("#f-name").focus();return toast("Gi tingen et navn");}
      var o={id:d.id,name:name,cat:pick.cat||"Annet",placeId:lockPlace?pid:(pick.placeId||d.placeId),
        qty:Math.max(0,Number(q.value)||0),unit:pick.unit||"stk",
        min:Math.max(0,Number(sh.querySelector("#f-min").value)||0),
        note:sh.querySelector("#f-note").value.trim(),fav:!!d.fav,
        photoId:pic.photoId||null,photo:pic.photo||null,updatedAt:Date.now()};
      if(isNew)S.items.push(o);else{var ex=byId(S.items,d.id);Object.assign(ex,o);o=ex;}
      Store.save("items",o);closeSheet();render();toast(name+" er lagret");
    };
    if(!isNew){
      sh.querySelector("#a-f").onclick=function(){var ex=byId(S.items,d.id);ex.fav=!ex.fav;touch(ex);closeSheet();render();};
      sh.querySelector("#a-e").onclick=function(){var ex=byId(S.items,d.id);ex.qty=0;touch(ex);if(inRound())autoList(ex);closeSheet();render();};
      sh.querySelector("#a-l").onclick=function(){
        var ex=byId(S.items,d.id);
        if(S.list.some(function(l){return l.itemId===ex.id;})){closeSheet();return toast("Står allerede på lista");}
        var e={id:uid(),text:ex.name,qty:"",num:1,unit:ex.unit||"stk",cat:ex.cat||"Annet",
               packed:false,carry:nextTripList(),itemId:ex.id,order:Date.now(),
               photoId:ex.photoId||null,photo:ex.photo||null};

/* --- rom: type + kallenavn --- */

  var count=p?itemsIn(p.id).length:0;

    (isNew?'<button type="button" class="btn" id="r-c" style="flex:1">Avbryt</button>'
          :'<button type="button" class="btn danger" id="r-d" style="flex:1">Slett</button>')+'</div>'+

    sh.querySelector("#r-s").onclick=function(){
      var nick=sh.querySelector("#r-n").value.trim();
      if(isNew){var np={id:uid(),type:pick.type,nick:nick,order:S.places.length};S.places.push(np);Store.save("places",np);}
      else{p.type=pick.type;p.nick=nick;Store.save("places",p);}

      if(count){closeSheet();return toast("Flytt eller slett de "+count+" tingene først");}

      Store.remove("places",p.id);browse.place=null;closeSheet();render();
    };
  });
}
/* På hytta fyller du lista til NESTE tur, ikke den du pakker ut nå */

}


/* Sikkerhetskopi: flytt hytta mellom nettlesere og versjoner */
function backupSheet(){
  var data=JSON.stringify({places:S.places,items:S.items,list:S.list,settings:S.settings});
  var h='<h2>Sikkerhetskopi</h2>'+
    '<p class="sub" style="margin:-12px 0 16px">Kopier teksten og ta vare på den. Åpner du appen et annet sted, limer du den inn her og trykker Hent inn.</p>'+
    '<div class="field"><label for="bk">Dataene dine</label><textarea id="bk" style="min-height:130px;font-family:var(--mono);font-size:.75rem">'+esc(data)+'</textarea></div>'+
    '<div class="sheetbtns"><button type="button" class="btn primary" id="bk-copy" style="flex:2">Kopier</button>'+
    '<button type="button" class="btn" id="bk-in" style="flex:1">Hent inn</button></div>';
  openSheet(h,function(sh){
    sh.querySelector("#bk-copy").onclick=function(){
      var t=sh.querySelector("#bk");t.select();
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value);
        else document.execCommand("copy");
        toast("Kopiert");
      }catch(e){toast("Marker teksten og kopier selv");}
    };
    sh.querySelector("#bk-in").onclick=function(){
      var raw=sh.querySelector("#bk").value.trim(),o;
      try{o=JSON.parse(raw);}catch(e){return toast("Teksten kunne ikke leses");}
      if(!o||!Array.isArray(o.places))return toast("Fant ingen hytte i teksten");
      S.places=o.places||[];S.items=o.items||[];S.list=o.list||[];
      S.settings=normSettings(o.settings);
      sortPlaces();Cache.write(S);
      if(db){
        S.places.forEach(function(p){Store.save("places",p);});
        S.items.forEach(function(i){Store.save("items",i);});
        S.list.forEach(function(l){Store.save("list",l);});
        Store.saveMeta();
      }
      closeSheet();screen=S.settings.onboarded?"home":"step";render();
      toast("Hytta er hentet inn");
    };
  });
}

/* Nullstilling – nyttig i brukertest, og eneste vei tilbake til oppsettet */

  openSheet('<h2>Start på nytt?</h2>'+
    '<p class="lede">Alle rom, alt innhold, lista og vednivået slettes'+
    (db?' – også for de andre som deler denne hytta':"")+'. Så kjøres oppsettet fra begynnelsen. Dette kan ikke angres.</p>'+

  function(sh){
    sh.querySelector("#rc").onclick=function(){closeSheet();};
    sh.querySelector("#rs").onclick=function(){closeSheet();resetAll();};
  });
}
function resetAll(){
  var refs=[];
  if(db){
    S.places.forEach(function(p){refs.push(db.collection("places").doc(p.id));});
    S.items.forEach(function(i){refs.push(db.collection("items").doc(i.id));});
    S.list.forEach(function(l){refs.push(db.collection("list").doc(l.id));});
  }
  seed();Cache.write(S);
  screen="step";browse.place=null;browse.cat=null;query="";roundOpen=null;
  window.scrollTo(0,0);render();
  if(db){
    db.doc("meta/settings").set(clean(S.settings)).catch(noop);
    (function drop(){
      if(!refs.length)return;
      Promise.all(refs.splice(0,8).map(function(r){return r.delete().catch(noop);})).then(drop);
    })();
  }
  toast("Hytta er nullstilt");
}

/* Legg til / endre noe på pakkelista. Samme skjema som når du registrerer
   noe i et rom – men uten rom: det velger du når du pakker ut. */
function lineSheet(l,after){
  var isNew=!l;
  var d=l?Object.assign({},l):{id:uid(),text:"",cat:"Annet",unit:"stk",num:1,photoId:null,photo:null};
  var n0=parseInt(d.num,10);
  if(!n0||n0<1)n0=parseInt(String(d.qty||"").replace(/[^0-9]/g,""),10)||1;
  var u0=d.unit||String(d.qty||"").replace(/[0-9\s]/g,"")||"stk";
  if(UNITS.indexOf(u0)<0)u0="stk";
  var pic={photoId:d.photoId||null,photo:d.photo||null,blob:null};
  var names={};S.items.forEach(function(i){names[i.name]=1;});
  var h='<h2>'+(isNew?"Legg til på lista":esc(d.text))+'</h2>'+
    '<p class="sub" style="margin:-12px 0 16px">Rommet velger du når du pakker ut.</p>'+
    '<div class="field"><span class="flabel">Bilde</span><div class="photo-row" id="f-pic"></div><p class="sub" id="f-pstat" hidden></p></div>'+
    '<div class="field"><label for="f-name">Navn</label><input type="text" id="f-name" list="ll" value="'+esc(d.text)+'" placeholder="F.eks. Kaffe" autocomplete="off">'+
      '<datalist id="ll">'+Object.keys(names).map(function(nm){return '<option value="'+esc(nm)+'"></option>';}).join("")+'</datalist></div>'+
    '<div class="field"><span class="flabel">Antall</span><div class="qtyrow">'+
      '<div class="stepper"><button type="button" id="f-m" aria-label="Færre">−</button></div>'+
      '<input type="number" id="f-q" inputmode="numeric" min="1" step="1" value="'+n0+'" aria-label="Antall">'+
      '<div class="stepper"><button type="button" id="f-p" aria-label="Flere">+</button></div></div></div>'+
    '<div class="field"><span class="flabel">Kategori</span>'+chips("cat",CATS,d.cat||"Annet")+'</div>'+
    '<button type="button" class="more" id="f-more" aria-expanded="false">Flere felt</button>'+
    '<div id="f-x" hidden><div class="field"><span class="flabel">Enhet</span>'+chips("unit",UNITS,u0)+'</div></div>'+
    '<div class="sheetbtns"><button type="button" class="btn primary" id="f-s" style="flex:2">'+(isNew?"Legg til":"Lagre")+'</button>'+
      (isNew?'<button type="button" class="btn" id="f-c" style="flex:1">Avbryt</button>'
            :'<button type="button" class="btn danger" id="f-d" style="flex:1">Fjern</button>')+'</div>';

  openSheet(h,function(sh){
    var pick={cat:d.cat||"Annet",unit:u0};
    sh.querySelectorAll("[data-chips]").forEach(function(g){
      g.addEventListener("click",function(e){
        var b=e.target.closest("button[data-val]");if(!b)return;
        g.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed","false");});
        b.setAttribute("aria-pressed","true");pick[g.dataset.chips]=b.dataset.val;
      });
    });
    function markChips(k,v){
      var g=sh.querySelector('[data-chips="'+k+'"]');
      if(g)g.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.val===v));});
    }
    function drawPic(){
      var box=sh.querySelector("#f-pic"),src=photoSrc(pic);
      box.innerHTML=(src?'<img class="photo-prev" src="'+esc(src)+'" alt="Valgt bilde">':"")+
        '<div class="picbtns">'+
          '<button type="button" class="mini" id="pc">'+(src?"Nytt bilde":"Ta bilde")+'</button>'+
          '<button type="button" class="mini" id="pa">Velg bilde</button>'+
          (src?'<button type="button" class="mini" id="pd">Fjern</button>':"")+
          (src?'<button type="button" class="mini" id="pi">Foreslå utfylling</button>':"")+
        '</div>';
      function took(r){
        if(pic.photoId&&pic.photoId!==r.photoId)dropPhoto(pic.photoId);
        pic.photoId=r.photoId;pic.photo=r.photo;pic.blob=r.blob||null;
        drawPic();
        identify();
      }
      box.querySelector("#pc").onclick=function(){pickPhoto(took,true);};
      box.querySelector("#pa").onclick=function(){pickPhoto(took,false);};
      var pd=box.querySelector("#pd");
      if(pd)pd.onclick=function(){dropPhoto(pic.photoId);pic.photoId=null;pic.photo=null;pic.blob=null;drawPic();};
      var pi=box.querySelector("#pi");
      if(pi)pi.onclick=identify;
    }
    /* Foreslår navn, antall, kategori og enhet ut fra bildet – alt kan rettes */
    function identify(){
      var stat=sh.querySelector("#f-pstat");
      function say(t){if(!stat)return;stat.hidden=!t;stat.textContent=t||"";}
      if(!pic.blob)return say("Ta eller velg bildet på nytt for å få forslag.");
      var why=aiWhy();
      if(why)return say(why);
      say("Leser bildet …");
      SAMPLE.json('Bildet viser én ting som skal på pakkelista til en hytte.\n'+
        'Er det en strekkode eller produktetikett, identifiser produktet.\n'+
        'Svar med KUN ett JSON-objekt: {"navn":"Kaffe","kategori":"Mat","enhet":"poser","antall":2}\n'+
        'kategori må være en av: '+CATS.join(", ")+'.\nenhet må være en av: '+UNITS.join(", ")+'.\n'+
        'Bruk norsk navn. Antall er hvor mange du ser, minst 1.',
        {images:pic.blob,modelTier:"default",cache:false})
      .then(function(r){
        if(!sheetEl)return;
        say("");
        if(!r)return;
        var nm=sh.querySelector("#f-name"),tok=[];
        if(r.navn&&nm&&!nm.value.trim()){nm.value=String(r.navn).slice(0,60);tok.push("navn");}
        if(UNITS.indexOf(r.enhet)>=0){pick.unit=r.enhet;markChips("unit",r.enhet);tok.push("enhet");}
        if(CATS.indexOf(r.kategori)>=0){pick.cat=r.kategori;markChips("cat",r.kategori);tok.push("kategori");}
        var q2=sh.querySelector("#f-q"),n2=parseInt(r.antall,10);
        if(q2&&n2>0){q2.value=n2;tok.push("antall");}
        if(r.navn)say("Forslag fra bildet: "+String(r.navn).slice(0,40)+" – rett hvis det er feil");
        else if(!tok.length)say("Fant ingenting sikkert i bildet – fyll ut selv.");
        if(tok.length)toast("Fylte ut "+tok.join(", ")+" fra bildet");
      })
      .catch(function(e){
        var c=e&&e.code;
        var m=(c==="images_unavailable")
          ?"Denne viseren kan ikke sende bilder til Claude. Fyll ut selv."
          :scanError(c);
        say(m||"");
        if(m&&c!=="images_unavailable")toast(m);
      });
    }
    drawPic();
    var q=sh.querySelector("#f-q");
    sh.querySelector("#f-m").onclick=function(){q.value=Math.max(1,(Number(q.value)||1)-1);};
    sh.querySelector("#f-p").onclick=function(){q.value=(Number(q.value)||0)+1;};
    sh.querySelector("#f-more").onclick=function(){
      var x=sh.querySelector("#f-x");x.hidden=!x.hidden;
      this.setAttribute("aria-expanded",String(!x.hidden));
      this.textContent=x.hidden?"Flere felt":"Færre felt";
    };
    /* Kjenner appen tingen fra før, fyller vi ut som sist */
    sh.querySelector("#f-name").addEventListener("change",function(){
      var v=this.value.trim().toLowerCase(),m=null;
      S.items.forEach(function(i){if(!m&&i.name.toLowerCase()===v)m=i;});
      if(!m)return;
      pick.unit=m.unit||"stk";pick.cat=m.cat||"Annet";
      markChips("unit",pick.unit);markChips("cat",pick.cat);
      toast("Fylte ut som forrige gang");
    });
    function done(){closeSheet();render();if(after)setTimeout(after,0);}
    if(sh.querySelector("#f-c"))sh.querySelector("#f-c").onclick=function(){closeSheet();if(after)setTimeout(after,0);};
    if(sh.querySelector("#f-d"))sh.querySelector("#f-d").onclick=function(){
      var ex=byId(S.list,d.id);if(ex)delLine(ex);done();
    };
    sh.querySelector("#f-s").onclick=function(){
      var name=sh.querySelector("#f-name").value.trim();
      if(!name){sh.querySelector("#f-name").focus();return toast("Gi tingen et navn");}
      var n=Math.max(1,Number(q.value)||1),u=pick.unit||"stk";
      var o={text:name,cat:pick.cat||"Annet",num:n,unit:u,
             qty:(n>1||u!=="stk")?(n+" "+u):"",
             photoId:pic.photoId||null,photo:pic.photo||null};
      if(isNew){
        var ex=null;
        S.items.forEach(function(x){if(!ex&&x.name.toLowerCase()===name.toLowerCase())ex=x;});
        var entry=Object.assign({id:d.id,packed:false,carry:nextTripList(),order:Date.now()},o);
        if(ex)entry.itemId=ex.id;
        S.list.push(entry);Store.save("list",entry);
        toast(name+" er lagt på lista");
      }else{
        var cur=byId(S.list,d.id);
        if(cur){Object.assign(cur,o);Store.save("list",cur);}
      }
      done();
    };
  });
}

/* ============================= Hendelser ============================= */
function bindStatic(){
  document.getElementById("searchbtn").addEventListener("click",function(){
    if(screen!=="browse")returnTo=(screen==="home"?"home":"step");
    if(screen==="browse"&&!browse.place&&!browse.cat&&(browse.view==="rom"||browse.view==="kat")){screen="step";query="";}
    else{screen="browse";query="";browse.place=null;browse.cat=null;if(browse.view!=="rom"&&browse.view!=="kat")browse.view="rom";}
    render();
    var f=document.getElementById("q");if(f)f.focus();
  });
  document.getElementById("menubtn").addEventListener("click",menuSheet);
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-a]");
    if(!b||document.getElementById("sheetroot").contains(b))return;
    e.preventDefault();
    var a=b.dataset.a,id=b.dataset.id,st=S.settings;

    /* oppsett */
    if(a==="s-start"){st.setup="rom";Store.saveMeta();window.scrollTo(0,0);render();return;}
    if(a==="s-addroom"){
      var np={id:uid(),type:b.dataset.t,nick:"",order:S.places.length};
      S.places.push(np);Store.save("places",np);render();
      var f=document.querySelector('[data-nick="'+np.id+'"]');if(f)f.focus();
      return;
    }
    if(a==="s-delroom"){
      var rp=place(b.dataset.p);if(!rp)return;
      itemsIn(rp.id).forEach(function(i){S.items=S.items.filter(function(x){return x.id!==i.id;});Store.remove("items",i.id);});
      S.places=S.places.filter(function(x){return x.id!==rp.id;});
      Store.remove("places",rp.id);render();return;
    }
    if(a==="s-torooms"){st.setup="fyll";st.setupIdx=0;Store.saveMeta();window.scrollTo(0,0);render();return;}
    if(a==="s-add"){
      var cp=S.places[st.setupIdx];if(!cp)return;
      var ni={id:uid(),name:b.dataset.n,cat:b.dataset.c,placeId:cp.id,qty:Number(b.dataset.q)||1,
        unit:b.dataset.u||"stk",min:0,note:"",fav:false,photoId:null,photo:null,updatedAt:Date.now()};
      S.items.push(ni);Store.save("items",ni);render();return;
    }
    if(a==="s-next"){
      if(st.setupIdx+1<S.places.length)st.setupIdx++;else st.setup="ved";
      Store.saveMeta();window.scrollTo(0,0);render();return;
    }
    if(a==="s-prev"){st.setupIdx=Math.max(0,st.setupIdx-1);Store.saveMeta();window.scrollTo(0,0);render();return;}
    if(a==="s-skipfill"){st.setup="ved";Store.saveMeta();window.scrollTo(0,0);render();return;}
    if(a==="s-done"){st.setup="ferdig";Store.saveMeta();window.scrollTo(0,0);render();return;}
    if(a==="s-go"){st.onboarded=true;st.phase="plan";Store.saveMeta();screen="home";window.scrollTo(0,0);render();return;}

    if(a==="gohome"){if(!st.onboarded)return;screen="home";query="";window.scrollTo(0,0);render();return;}
    if(a==="gostep"){screen="step";window.scrollTo(0,0);render();return;}
    if(a==="gorooms"){screen="browse";browse.view="rom";browse.place=null;browse.cat=null;query="";returnTo="home";window.scrollTo(0,0);render();return;}
    if(a==="goved"){screen="browse";browse.view="ved";browse.place=null;browse.cat=null;query="";returnTo="home";window.scrollTo(0,0);render();return;}
    if(a==="golist"){listSheet();return;}
    if(a==="gosearch"){returnTo="home";screen="browse";browse.view="rom";browse.place=null;browse.cat=null;query="";window.scrollTo(0,0);render();var qf=document.getElementById("q");if(qf)qf.focus();return;}
    if(a==="scan"){photoScan(b.dataset.p);return;}

    if(a==="h-add"){
      var hp={id:uid(),type:b.dataset.t,nick:"",order:S.places.length};
      S.places.push(hp);Store.save("places",hp);render();
      var hf=document.querySelector('[data-nick="'+hp.id+'"]');if(hf)hf.focus();
      return;
    }
    if(a==="h-del"){
      var dp=place(b.dataset.p);if(!dp)return;
      var cnt=itemsIn(dp.id).length;
      if(cnt)return toast("Flytt eller slett de "+cnt+" tingene først");
      S.places=S.places.filter(function(x){return x.id!==dp.id;});
      Store.remove("places",dp.id);render();
      toast(pName(dp)+" er fjernet","Angre",function(){S.places.push(dp);sortPlaces();Store.save("places",dp);render();});
      return;
    }

    if(a==="inc")bump(id,1);
    else if(a==="dec")bump(id,-1);
    else if(a==="open")itemSheet(byId(S.items,id));
    else if(a==="fav"){var f=byId(S.items,id);if(f){f.fav=!f.fav;touch(f);render();}}
    /* runden */
    else if(a==="startround"){st.phase="kontroll";st.roundDone=[];roundOpen=null;Store.saveMeta();screen="step";window.scrollTo(0,0);render();}
    else if(a==="k-open"){roundOpen=b.dataset.p;window.scrollTo(0,0);render();}
    else if(a==="k-back"){roundOpen=null;window.scrollTo(0,0);render();}
    else if(a==="roomdone"){
      if((st.roundDone||[]).indexOf(id)<0)st.roundDone=(st.roundDone||[]).concat([id]);
      roundOpen=null;Store.saveMeta();window.scrollTo(0,0);render();
    }
    else if(a==="addhere")itemSheet(null,b.dataset.p,null,true);
    else if(a==="endround"){var n=S.list.length;roundOpen=null;goPhase("plan");toast(n?"Lista er klar – "+n+" ting":"Kontrollen er ferdig");}
    /* planlegg */
    else if(a==="packtoggle"){var l=byId(S.list,id);if(l){l.packed=!l.packed;Store.save("list",l);render();}}
    else if(a==="sugadd"){
      var t=b.dataset.s,ex=null;
      S.items.forEach(function(i){if(!ex&&i.name.toLowerCase()===t.toLowerCase())ex=i;});
      var e={id:uid(),text:t,qty:"",num:1,
        unit:(ex&&ex.unit)||b.dataset.u||"stk",
        cat:(ex&&ex.cat)||b.dataset.c||"Annet",
        packed:false,carry:nextTripList(),order:Date.now()};
      if(ex)e.itemId=ex.id;
      S.list.push(e);Store.save("list",e);render();toast(t+" er lagt på lista");
    }
    else if(a==="editline"){var l2=byId(S.list,id);if(l2)lineSheet(l2);}
    else if(a==="newline"){lineSheet(null);}
    else if(a==="leave"){
      var rest=S.list.filter(function(x){return !x.packed;});
      if(rest.length)leaveSheet(rest);else goPhase("pavei");
    }
    /* på vei */
    else if(a==="backtoplan")goPhase("plan");
    else if(a==="startunpack")goPhase("pakkut");
    /* pakk ut */
    else if(a==="place")placeLine(id);
    else if(a==="carry"){var cl=byId(S.list,id);if(cl){cl.carry=true;Store.save("list",cl);render();}}
    else if(a==="uncarry"){var ul=byId(S.list,id);if(ul){ul.carry=false;Store.save("list",ul);render();}}
    else if(a==="unpackdone")goPhase("utpakket");
    else if(a==="toplan")goPhase("plan");
    /* ved */
    else if(a==="wood"){st.wood=b.dataset.key;st.woodUpdated=Date.now();Store.saveMeta();render();}
    else if(a==="woodpic"){
      pickPhoto(function(r){
        if(st.woodPhotoId&&st.woodPhotoId!==r.photoId)dropPhoto(st.woodPhotoId);
        st.woodPhotoId=r.photoId;st.woodPhoto=r.photo;st.woodUpdated=Date.now();
        Store.saveMeta();render();toast("Bilde lagret");
      });
    }
    else if(a==="woodpicdel"){dropPhoto(st.woodPhotoId);st.woodPhotoId=null;st.woodPhoto=null;Store.saveMeta();render();}
    /* bla og søk */
    else if(a==="closebrowse"){screen=(returnTo==="home"?"home":"step");query="";window.scrollTo(0,0);render();}
    else if(a==="tab"){browse.view=b.dataset.t;render();}
    else if(a==="openroom"){browse.place=b.dataset.p;window.scrollTo(0,0);render();}
    else if(a==="uproom"){browse.place=null;render();}
    else if(a==="opencat"){browse.cat=b.dataset.c;openGroups={};window.scrollTo(0,0);render();}
    else if(a==="upcat"){browse.cat=null;render();}
    else if(a==="group"){var k=b.dataset.k;openGroups[k]=!openGroups[k];render();}
    else if(a==="newroom")roomSheet(null);
    else if(a==="editroom")roomSheet(place(b.dataset.p));
    else if(a==="addnamed")itemSheet(null,null,query.trim());
  });
  document.addEventListener("input",function(e){
    if(e.target.id==="q"){
      query=e.target.value;
      clearTimeout(render._q);render._q=setTimeout(render,90);
      return;
    }
    var nid=e.target.dataset&&e.target.dataset.nick;
    if(nid){
      var p=place(nid);if(!p)return;
      p.nick=e.target.value;
      clearTimeout(p._t);p._t=setTimeout(function(){Store.save("places",p);},400);
    }
  });
  document.addEventListener("submit",function(e){
    if(e.target.id==="addform2"){
      e.preventDefault();
      var p2=S.places[S.settings.setupIdx],inp=document.getElementById("additem");
      var v2=inp?inp.value.trim():"";
      if(!p2||!v2)return;
      var ni={id:uid(),name:v2,cat:(catsFor(p2)[0]||"Annet"),placeId:p2.id,qty:1,unit:"stk",min:0,note:"",
        fav:false,photoId:null,photo:null,updatedAt:Date.now()};
      S.items.push(ni);Store.save("items",ni);render();
      var again=document.getElementById("additem");if(again)again.focus();
      return;
    }
  });
}

boot();
})();
</script>

</body>
</html>
